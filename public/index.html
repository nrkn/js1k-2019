<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-RL</title>
    <style>
      html {
        box-sizing: border-box;
      }
      
      body {
        font-family: sans-serif;
        margin: 0;
      }
      
      *, *:before, *:after {
        box-sizing: inherit;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      #viewport {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <script src="/src/index.js" type="module"></script>
  </body>
</html>
